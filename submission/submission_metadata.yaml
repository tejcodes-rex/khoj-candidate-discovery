# ============================================================================
# Approach summary  (<=200 words)
# ============================================================================
methodology_summary: |
  Khoj is a transparent, rule-based ranker that treats the job description as the
  rubric. Each candidate scores on four weighted parts: career-history evidence
  of retrieval, ranking, search, recsys and NLP work (weighted above the skills
  list), skills trust-weighted by endorsements, months used and assessment score,
  title relevance, and closeness to the 6 to 8 year band. Two multipliers follow:
  a behavioral-availability factor from Redrob activity signals, and a location
  factor favouring India hubs. The JD's named disqualifiers (off-role keyword
  stuffers, pure-services careers, job-hoppers, vision/speech-only, pure research)
  apply explicit penalties. Honeypots are caught by internal-consistency checks
  and forced out of the shortlist. Reasoning for each pick is generated from the
  candidate's own fields, with honest concerns surfaced. The whole ranking runs in
  about 16 seconds on a laptop CPU, no GPU, no network, no per-candidate model
  calls, which is both a compute-budget requirement and a statement about what
  scales in a real recruiting product.

