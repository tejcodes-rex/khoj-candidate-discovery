<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="560" fill="#FFFFFF"/>

  <!-- LEFT: bar chart -->
  <text x="40" y="44" font-size="20" font-weight="700" fill="#1E2A78">Top 100 quality vs a naive keyword ranking</text>
  <text x="40" y="70" font-size="15" fill="#5B6472">Wrong candidates the two systems put in their top 100 (lower is better)</text>

  <!-- axes -->
  <line x1="90" y1="110" x2="90" y2="450" stroke="#C9D0E0" stroke-width="2"/>
  <line x1="90" y1="450" x2="600" y2="450" stroke="#C9D0E0" stroke-width="2"/>
  <g font-size="13" fill="#9aa3b2">
    <text x="82" y="455" text-anchor="end">0</text>
    <text x="82" y="368" text-anchor="end">25</text>
    <text x="82" y="285" text-anchor="end">50</text>
    <text x="82" y="202" text-anchor="end">75</text>
    <text x="82" y="119" text-anchor="end">100</text>
  </g>
  <line x1="90" y1="367" x2="600" y2="367" stroke="#EEF1F8" stroke-width="1"/>
  <line x1="90" y1="284" x2="600" y2="284" stroke="#EEF1F8" stroke-width="1"/>
  <line x1="90" y1="201" x2="600" y2="201" stroke="#EEF1F8" stroke-width="1"/>

  <!-- group 1: keyword stuffers -->
  <rect x="150" y="168" width="64" height="282" rx="6" fill="#E5484D"/>
  <text x="182" y="160" font-size="18" font-weight="700" fill="#E5484D" text-anchor="middle">85</text>
  <rect x="232" y="444" width="64" height="6" rx="3" fill="#1FAA6E"/>
  <text x="264" y="436" font-size="18" font-weight="700" fill="#1FAA6E" text-anchor="middle">0</text>
  <text x="223" y="478" font-size="15" font-weight="600" fill="#14161F" text-anchor="middle">Keyword stuffers</text>

  <!-- group 2: unreachable -->
  <rect x="390" y="218" width="64" height="232" rx="6" fill="#E5484D"/>
  <text x="422" y="210" font-size="18" font-weight="700" fill="#E5484D" text-anchor="middle">70</text>
  <rect x="472" y="397" width="64" height="53" rx="6" fill="#1FAA6E"/>
  <text x="504" y="389" font-size="18" font-weight="700" fill="#1FAA6E" text-anchor="middle">16</text>
  <text x="463" y="478" font-size="15" font-weight="600" fill="#14161F" text-anchor="middle">Unreachable</text>

  <!-- legend -->
  <rect x="150" y="500" width="16" height="16" rx="3" fill="#E5484D"/><text x="174" y="513" font-size="15" fill="#5B6472">Naive keyword ranking</text>
  <rect x="360" y="500" width="16" height="16" rx="3" fill="#1FAA6E"/><text x="384" y="513" font-size="15" fill="#5B6472">Khoj</text>

  <!-- RIGHT: metric cards -->
  <text x="660" y="44" font-size="20" font-weight="700" fill="#1E2A78">Verified metrics</text>
  <g>
    <rect x="660" y="70" width="270" height="120" rx="14" fill="#EEF2FF" stroke="#3B5BFF" stroke-width="2"/>
    <text x="684" y="108" font-size="16" fill="#5B6472">Internal NDCG@10</text>
    <text x="684" y="158" font-size="44" font-weight="700" fill="#1E2A78">0.92</text>

    <rect x="950" y="70" width="270" height="120" rx="14" fill="#EEF2FF" stroke="#3B5BFF" stroke-width="2"/>
    <text x="974" y="108" font-size="16" fill="#5B6472">Precision@10</text>
    <text x="974" y="158" font-size="44" font-weight="700" fill="#1E2A78">1.00</text>

    <rect x="660" y="206" width="270" height="120" rx="14" fill="#E9F7F0" stroke="#1FAA6E" stroke-width="2"/>
    <text x="684" y="244" font-size="16" fill="#5B6472">Runtime (limit 5 min)</text>
    <text x="684" y="294" font-size="44" font-weight="700" fill="#157A4F">~100s</text>

    <rect x="950" y="206" width="270" height="120" rx="14" fill="#E9F7F0" stroke="#1FAA6E" stroke-width="2"/>
    <text x="974" y="244" font-size="16" fill="#5B6472">Honeypots in top 100</text>
    <text x="974" y="294" font-size="44" font-weight="700" fill="#157A4F">0</text>
  </g>

  <!-- bottom strip -->
  <rect x="660" y="342" width="560" height="120" rx="14" fill="#1E2A78"/>
  <text x="684" y="378" font-size="16" fill="#CBD2F5">Compute constraints, all met:</text>
  <text x="684" y="408" font-size="16" font-weight="600" fill="#FFFFFF">CPU only, no GPU, no network during ranking, standard library only</text>
  <text x="684" y="438" font-size="16" font-weight="600" fill="#FFD45A">Official validator: "Submission is valid.", top 100 is 100% India based</text>

  <text x="660" y="500" font-size="14" fill="#5B6472">Top 100: 71 strong fit, 17 good fit, 12 marginal. Zero off role, zero stuffers, zero services only.</text>
  <text x="660" y="523" font-size="14" fill="#5B6472">Top 10 are genuine retrieval / ranking builders; every keyword decoy is ranked out of the top 100.</text>
</svg>
