<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/><stop offset="1" stop-color="#1E2A78"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#3B5BFF"/>
    </marker>
  </defs>
  <rect width="1280" height="560" fill="#FFFFFF"/>

  <!-- INPUTS -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#1E2A78">INPUTS</text>
  <rect x="40" y="60" width="230" height="84" rx="12" fill="#F4F6FB" stroke="#D8DEEC" stroke-width="2"/>
  <text x="155" y="95" font-size="19" font-weight="600" fill="#14161F" text-anchor="middle">100,000 candidate</text>
  <text x="155" y="120" font-size="19" font-weight="600" fill="#14161F" text-anchor="middle">profiles (JSONL)</text>
  <rect x="40" y="160" width="230" height="84" rx="12" fill="#F4F6FB" stroke="#D8DEEC" stroke-width="2"/>
  <text x="155" y="195" font-size="19" font-weight="600" fill="#14161F" text-anchor="middle">Job description</text>
  <text x="155" y="220" font-size="16" fill="#5B6472" text-anchor="middle">Senior AI Engineer</text>

  <!-- STAGE 1 -->
  <line x1="278" y1="152" x2="318" y2="152" stroke="#3B5BFF" stroke-width="3" marker-end="url(#arr)"/>
  <text x="330" y="40" font-size="20" font-weight="700" fill="#1E2A78">PREPARE</text>
  <rect x="330" y="60" width="250" height="184" rx="12" fill="#FFFFFF" stroke="#D8DEEC" stroke-width="2"/>
  <text x="455" y="92" font-size="18" font-weight="700" fill="#1E2A78" text-anchor="middle">Ingest &amp; normalize</text>
  <text x="455" y="118" font-size="15" fill="#5B6472" text-anchor="middle">word boundary matching</text>
  <text x="455" y="140" font-size="15" fill="#5B6472" text-anchor="middle">dedup, robust to missing fields</text>
  <line x1="350" y1="158" x2="560" y2="158" stroke="#EDEFF6" stroke-width="2"/>
  <text x="455" y="186" font-size="18" font-weight="700" fill="#1E2A78" text-anchor="middle">Feature &amp; signal</text>
  <text x="455" y="208" font-size="18" font-weight="700" fill="#1E2A78" text-anchor="middle">extraction</text>
  <text x="455" y="230" font-size="15" fill="#5B6472" text-anchor="middle">from career history, not summaries</text>

  <!-- CORE SCORER -->
  <line x1="588" y1="152" x2="628" y2="152" stroke="#3B5BFF" stroke-width="3" marker-end="url(#arr)"/>
  <text x="640" y="40" font-size="20" font-weight="700" fill="#1E2A78">FIT SCORER</text>
  <rect x="640" y="60" width="330" height="260" rx="14" fill="url(#core)"/>
  <text x="805" y="92" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Weighted fit score</text>
  <!-- component bars -->
  <g font-size="15" fill="#FFFFFF">
    <text x="664" y="128">Career evidence</text><rect x="664" y="134" width="282" height="14" rx="7" fill="#2A3A9E"/><rect x="664" y="134" width="282" height="14" rx="7" fill="#FFB020"/><text x="952" y="146" text-anchor="end" fill="#1E2A78" font-weight="700">.40</text>
    <text x="664" y="172">Skill trust</text><rect x="664" y="178" width="282" height="14" rx="7" fill="#2A3A9E"/><rect x="664" y="178" width="155" height="14" rx="7" fill="#FFD45A"/><text x="952" y="190" text-anchor="end" fill="#FFD45A" font-weight="700">.22</text>
    <text x="664" y="216">Title relevance</text><rect x="664" y="222" width="282" height="14" rx="7" fill="#2A3A9E"/><rect x="664" y="222" width="127" height="14" rx="7" fill="#FFD45A"/><text x="952" y="234" text-anchor="end" fill="#FFD45A" font-weight="700">.18</text>
    <text x="664" y="260">Experience band</text><rect x="664" y="266" width="282" height="14" rx="7" fill="#2A3A9E"/><rect x="664" y="266" width="141" height="14" rx="7" fill="#FFD45A"/><text x="952" y="278" text-anchor="end" fill="#FFD45A" font-weight="700">.20</text>
  </g>
  <text x="805" y="306" font-size="15" fill="#CBD2F5" text-anchor="middle">× behavioral availability × location</text>

  <!-- GUARDS below core -->
  <rect x="640" y="338" width="330" height="62" rx="12" fill="#FFF4E8" stroke="#FFB020" stroke-width="2"/>
  <text x="805" y="365" font-size="16" font-weight="700" fill="#B25A00" text-anchor="middle">Disqualifier penalties</text>
  <text x="805" y="387" font-size="14" fill="#8A5A1A" text-anchor="middle">stuffers, services only, job hoppers, vision only, honeypot guard</text>

  <!-- OUTPUTS -->
  <line x1="978" y1="190" x2="1018" y2="190" stroke="#3B5BFF" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1030" y="40" font-size="20" font-weight="700" fill="#1E2A78">OUTPUT</text>
  <rect x="1030" y="60" width="210" height="84" rx="12" fill="#E9F7F0" stroke="#1FAA6E" stroke-width="2"/>
  <text x="1135" y="95" font-size="18" font-weight="700" fill="#157A4F" text-anchor="middle">Ranked top 100</text>
  <text x="1135" y="120" font-size="15" fill="#1FAA6E" text-anchor="middle">validator clean CSV</text>
  <rect x="1030" y="160" width="210" height="84" rx="12" fill="#F4F6FB" stroke="#D8DEEC" stroke-width="2"/>
  <text x="1135" y="195" font-size="18" font-weight="700" fill="#1E2A78" text-anchor="middle">Grounded reason</text>
  <text x="1135" y="220" font-size="15" fill="#5B6472" text-anchor="middle">for every candidate</text>

  <!-- footer strip -->
  <rect x="40" y="470" width="1200" height="60" rx="12" fill="#1E2A78"/>
  <text x="60" y="497" font-size="15" fill="#CBD2F5">Modules:</text>
  <text x="135" y="497" font-size="15" font-weight="700" fill="#FFFFFF">match, lexicons, scoring, honeypot, reasoning, rank.py</text>
  <text x="60" y="518" font-size="15" fill="#FFD45A">Python standard library only, CPU, no GPU, no network during ranking, 100,000 candidates in under 2 minutes</text>
</svg>
