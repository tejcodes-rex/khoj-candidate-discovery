<svg width="1280" height="470" viewBox="0 0 1280 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1280" height="470" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="19" font-weight="700" fill="#1E2A78">How the score is built (transparent, rule-based, every term cites the candidate's own data)</text>

  <!-- row 1: weighted sum -->
  <g>
    <rect x="40" y="70" width="250" height="92" rx="12" fill="url(#g1)"/>
    <rect x="40" y="70" width="250" height="92" rx="12" fill="#1E2A78"/>
    <text x="165" y="104" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Career evidence</text>
    <text x="165" y="138" font-size="26" font-weight="700" fill="#FFD45A" text-anchor="middle">0.40</text>
    <text x="305" y="124" font-size="28" fill="#5B6472" text-anchor="middle">+</text>
    <rect x="322" y="70" width="210" height="92" rx="12" fill="#EEF2FF" stroke="#3B5BFF" stroke-width="2"/>
    <text x="427" y="104" font-size="17" font-weight="700" fill="#1E2A78" text-anchor="middle">Skill trust</text>
    <text x="427" y="138" font-size="26" font-weight="700" fill="#3B5BFF" text-anchor="middle">0.22</text>
    <text x="547" y="124" font-size="28" fill="#5B6472" text-anchor="middle">+</text>
    <rect x="564" y="70" width="210" height="92" rx="12" fill="#EEF2FF" stroke="#3B5BFF" stroke-width="2"/>
    <text x="669" y="104" font-size="17" font-weight="700" fill="#1E2A78" text-anchor="middle">Title</text>
    <text x="669" y="138" font-size="26" font-weight="700" fill="#3B5BFF" text-anchor="middle">0.18</text>
    <text x="789" y="124" font-size="28" fill="#5B6472" text-anchor="middle">+</text>
    <rect x="806" y="70" width="210" height="92" rx="12" fill="#EEF2FF" stroke="#3B5BFF" stroke-width="2"/>
    <text x="911" y="104" font-size="17" font-weight="700" fill="#1E2A78" text-anchor="middle">Experience</text>
    <text x="911" y="138" font-size="26" font-weight="700" fill="#3B5BFF" text-anchor="middle">0.20</text>
    <text x="1036" y="124" font-size="26" fill="#5B6472" text-anchor="middle">=</text>
    <rect x="1058" y="70" width="182" height="92" rx="12" fill="#E9F7F0" stroke="#1FAA6E" stroke-width="2"/>
    <text x="1149" y="104" font-size="16" font-weight="700" fill="#157A4F" text-anchor="middle">Relevance</text>
    <text x="1149" y="130" font-size="16" font-weight="700" fill="#157A4F" text-anchor="middle">fit</text>
  </g>

  <!-- row 2: multipliers -->
  <text x="40" y="222" font-size="17" font-weight="700" fill="#14161F">then two real-world multipliers</text>
  <rect x="40" y="238" width="300" height="70" rx="12" fill="#FFF4E8" stroke="#FFB020" stroke-width="2"/>
  <text x="190" y="270" font-size="17" font-weight="700" fill="#B25A00" text-anchor="middle">× behavioral availability</text>
  <text x="190" y="294" font-size="14" fill="#8A5A1A" text-anchor="middle">recency, response rate, open-to-work</text>
  <rect x="360" y="238" width="260" height="70" rx="12" fill="#FFF4E8" stroke="#FFB020" stroke-width="2"/>
  <text x="490" y="270" font-size="17" font-weight="700" fill="#B25A00" text-anchor="middle">× location</text>
  <text x="490" y="294" font-size="14" fill="#8A5A1A" text-anchor="middle">India hubs, Pune/Noida preferred</text>

  <!-- row 3: penalties + honeypot -->
  <text x="660" y="222" font-size="17" font-weight="700" fill="#14161F">then named disqualifier penalties</text>
  <rect x="660" y="238" width="580" height="70" rx="12" fill="#FDECEC" stroke="#E5484D" stroke-width="2"/>
  <text x="680" y="268" font-size="15" fill="#A02A2E">keyword stuffer ×0.15  ·  services-only ×0.7  ·  job-hopper ×0.8  ·  vision-only ×0.5</text>
  <text x="680" y="292" font-size="15" font-weight="700" fill="#A02A2E">honeypot (impossible profile) → score forced to 0, excluded</text>

  <!-- final -->
  <rect x="40" y="350" width="1200" height="90" rx="14" fill="#1E2A78"/>
  <text x="60" y="385" font-size="18" font-weight="700" fill="#FFFFFF">Final score  →  sort by score descending, then candidate id ascending  →  take the top 100</text>
  <text x="60" y="416" font-size="15" fill="#FFD45A">No black box: a learning-to-rank model can slot in behind the same interface, but the JD is explicit enough that transparent feature scoring wins, and it explains itself.</text>
</svg>
